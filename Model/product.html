{% extends "base.html" %}
{% block content %}

<div class="product-page">
  <div class="product-main">
    <div class="product-image" style="position:relative;">
      <img id="mainProductImg" src="{{ url_for('static', filename='images/' + product.image) }}" alt="{{ product.name }}">
      <canvas id="cropCanvas"></canvas>
      <button id="cropModeBtn" class="crop-btn">🖼️ Crop Mode</button>
    </div>

    <div class="product-info">
      <h2>{{ product.name }}</h2>
      <p>₹ {{ product.price }}</p>
      <p>Category: {{ product.category }}</p>
      <form method="POST" action="/cart/add">
        <input type="hidden" name="product" value="{{ product.image }}">
        <label>Qty</label>
        <input type="number" value="1" name="qty" min="1">
        <button type="submit">Add to Cart</button>
      </form>
    </div>
  </div>

  <!-- Similar Products -->
  {% if similar %}
  <div class="similar-products">
    <h3>Similar Products</h3>
    <div class="similar-grid">
      {% for s in similar %}
      <a href="/product/{{ s }}"><img src="{{ url_for('static', filename='images/' + s) }}" alt="{{ s }}"></a>
      {% endfor %}
    </div>
  </div>
  {% endif %}

  <!-- Cropped Similar Products -->
  <div id="similarCropped"></div>
</div>

<!-- Inline JS for Crop Mode -->
<script>
const cropBtn = document.getElementById('cropModeBtn');
const img = document.getElementById('mainProductImg');
const canvas = document.getElementById('cropCanvas');
const ctx = canvas.getContext('2d');

let isCropping = false;
let startX, startY;

// Activate crop mode
cropBtn.onclick = () => {
    isCropping = !isCropping;
    canvas.width = img.width;
    canvas.height = img.height;
    canvas.style.display = isCropping ? 'block' : 'none';
    cropBtn.innerText = isCropping ? 'Cancel Crop' : '🖼️ Crop Mode';
};

// Mouse down - start cropping
canvas.onmousedown = e => {
    if(!isCropping) return;
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX - rect.left;
    startY = e.clientY - rect.top;
};

// Mouse move - show rectangle
canvas.onmousemove = e => {
    if(!isCropping || startX === undefined) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const w = x - startX;
    const h = y - startY;

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, startY, w, h);
};

// Mouse up - finalize crop
canvas.onmouseup = e => {
    if(!isCropping) return;
    const rect = canvas.getBoundingClientRect();
    const endX = e.clientX - rect.left;
    const endY = e.clientY - rect.top;
    const w = endX - startX;
    const h = endY - startY;

    // Draw final rect
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeRect(startX, startY, w, h);

    // Create temp canvas for cropped image
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = Math.abs(w);
    tempCanvas.height = Math.abs(h);
    const tctx = tempCanvas.getContext('2d');

    const sx = w < 0 ? endX : startX;
    const sy = h < 0 ? endY : startY;
    tctx.drawImage(img, sx, sy, Math.abs(w), Math.abs(h), 0, 0, Math.abs(w), Math.abs(h));

    const croppedData = tempCanvas.toDataURL('image/jpeg');

    // Send cropped image to server
    fetch('/crop_upload', {
        method: 'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({image: croppedData})
    })
    .then(res => res.json())
    .then(data => {
        let html = '<h3>Similar Items</h3><div class="similar-grid">';
        data.similar.forEach(s => {
            html += `<a href="/product/${s}"><img src="/static/images/${s}" alt="${s}"></a>`;
        });
        html += '</div>';
        document.getElementById('similarCropped').innerHTML = html;
    });

    // Reset
    startX = undefined;
    startY = undefined;
};
</script>

{% endblock %}
